<!DOCTYPE html>
<html lang="en">
    <head>
        <title>JavaScript Notes</title>
        <meta charset="UTF-8">
        
            <style>
            img{
                width: 50%
            }
            #img-wrapper{
                display: none;
            }
            </style>
            <script>
            function change_color(){
                document.getElementById("change").style.color = "cyan"
            }
            function show_img(){
                if(document.getElementById("img-wrapper").style.display == "block"){
                    document.getElementById("img-wrapper").style.display = "none"
                    document.getElementById("show").innerHTML = "Show Image"
                }else{
                document.getElementById("img-wrapper").style.display = "block"
                document.getElementById("show").innerHTML = "Hide Image"
                }

            }
            function hover(id){
                document.getElementById("button").style.backgoundColor = "blue"
                document.getElementById("button").style.color = "cyan"
            }
            function unhover(id){
                document.getElementById(id).style.backgoundColor = "grey"
                document.getElementById(id).style.color = "black"
            }
            function popup(){
                alert("You should be taking notes!")
            }
            let images =["https://www.travelandleisure.com/trip-ideas/beach-vacations/most-beautiful-beaches-in-the-world","https://ethnasia.com/it/blogs/blog/the-most-beautiful-beaches-in-the-world?srsltid=AfmBOorSx1yvs4COV6ap-kK5oHWHK_I0kynyWlSOq-f1vR10c-fikTFe", "https://www.bestproducts.com/lifestyle/g2209/best-beaches-for-vacations/",]
            //onclick onmousedown onmouseup onmouseenter-onmouseover onmouseleave-onmouseout
        </script>
        
    </head>
    <body>
        <h1 id="change" onmouseover="popup()">JavaScript Notes</h1>
        <button onclick="change_color()" onmouseover="hover('button')" id="button">Click me</button>
        <button onclick="show_img()" id="show" onmouseover="hover('show')">Show Image</button>
        <div id="img-wrapper">
            <img src= "https://www.travelandleisure.com/trip-ideas/beach-vacations/most-beautiful-beaches-in-the-world" alt="Pretty beach" height="200px">
        </div>

    </body>
</html>
